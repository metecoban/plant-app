name: plant_app
description: "A Flutter application built for the Plant App case study."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  # ── Flutter SDK ──────────────────────────────────────────────────────────────
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ── State Management ───────────────────────────────────────────────────────
  flutter_bloc: ^9.1.1

  # ── Network ──────────────────────────────────────────────────────────────────
  dio: ^5.10.0

  # ── Dependency Injection ─────────────────────────────────────────────────────
  get_it: ^9.2.1
  injectable: ^3.0.0

  # ── Serialization & Immutability ─────────────────────────────────────────────
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # ── Local Storage ────────────────────────────────────────────────────────────
  shared_preferences: ^2.5.5

  # ── Navigation ───────────────────────────────────────────────────────────────
  auto_route: ^11.1.0
  flutter_native_splash: ^2.4.7

  # ── UI ───────────────────────────────────────────────────────────────────────
  flutter_svg: ^2.3.0

  # ── Localization ─────────────────────────────────────────────────────────────
  slang: ^4.18.0
  slang_flutter: ^4.18.0

  # ── Logging & Debugging ──────────────────────────────────────────────────────
  talker_flutter: ^5.1.19
  talker_dio_logger: ^5.1.19
  talker_bloc_logger: ^5.1.19

dev_dependencies:
  # ── Flutter SDK ──────────────────────────────────────────────────────────────
  flutter_test:
    sdk: flutter

  # ── Linting ──────────────────────────────────────────────────────────────────
  flutter_lints: ^6.0.0

  # ── Code Generation ──────────────────────────────────────────────────────────
  build_runner: ^2.15.1
  freezed: ^4.0.0-dev.3
  json_serializable: ^6.14.0
  auto_route_generator: ^10.6.0
  injectable_generator: ^3.1.1
  slang_build_runner: ^4.18.0
  flutter_gen_runner: ^5.15.0

  # ── Testing ──────────────────────────────────────────────────────────────────
  mocktail: ^1.0.5

flutter_gen:
  output: lib/gen/
  integrations:
    flutter_svg: true
  assets:
    exclude:
      - assets/i18n/**

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/app_logo.jpeg
  color_dark: "#FFFFFF"
  image_dark: assets/images/app_logo.jpeg
  android_12:
    color: "#FFFFFF"
    image: assets/images/app_logo.jpeg
    color_dark: "#FFFFFF"
    image_dark: assets/images/app_logo.jpeg

flutter:
  uses-material-design: true

  assets:
    - assets/i18n/
    - assets/images/
    - assets/images/onboarding/
    - assets/images/home/
    - assets/icons/
    - assets/icons/home/
    - assets/icons/paywall/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto/roboto_light.ttf
          weight: 300
        - asset: assets/fonts/roboto/roboto_regular.ttf
          weight: 400
        - asset: assets/fonts/roboto/roboto_medium.ttf
          weight: 500
        - asset: assets/fonts/roboto/roboto_bold.ttf
          weight: 700
    - family: Rubik
      fonts:
        - asset: assets/fonts/rubik/rubik_regular.ttf
          weight: 400
