name: plant_app
description: "A Flutter application built for the Plant App case study."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  # ── Flutter SDK ──────────────────────────────────────────────────────────────
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ── State Management ───────────────────────────────────────────────────────
  flutter_bloc: ^9.1.1

  # ── Network ──────────────────────────────────────────────────────────────────
  dio: ^5.10.0

  # ── Dependency Injection ─────────────────────────────────────────────────────
  get_it: ^9.2.1

  # ── Serialization & Immutability ─────────────────────────────────────────────
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # ── Local Storage ────────────────────────────────────────────────────────────
  shared_preferences: ^2.5.5

  # ── Navigation ───────────────────────────────────────────────────────────────
  auto_route: ^11.1.0

  # ── UI ───────────────────────────────────────────────────────────────────────
  flutter_svg: ^2.3.0

  # ── Logging & Debugging ──────────────────────────────────────────────────────
  talker_flutter: ^5.1.19
  talker_dio_logger: ^5.1.19
  talker_bloc_logger: ^5.1.19

dev_dependencies:
  # ── Flutter SDK ──────────────────────────────────────────────────────────────
  flutter_test:
    sdk: flutter

  # ── Linting ──────────────────────────────────────────────────────────────────
  flutter_lints: ^6.0.0

  # ── Code Generation ──────────────────────────────────────────────────────────
  build_runner: ^2.15.1
  freezed: ^4.0.0-dev.3
  json_serializable: ^6.14.0
  auto_route_generator: ^10.6.0

  # ── Testing ──────────────────────────────────────────────────────────────────
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
